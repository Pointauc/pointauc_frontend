name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: ''

jobs:
  deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate .env.local from GitHub variables
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          node -e '
            const vars = JSON.parse(process.env.VARS_JSON || "{}");
            const entries = Object.entries(vars).filter(([key]) => key.startsWith("VITE_"));

            // Safety guardrail: ensure no sensitive credentials were accidentally prefixed with VITE_
            const forbiddenKeywords = [/SECRET/i, /PRIVATE/i, /PASSWORD/i, /TOKEN.*PRIVATE/i];
            for (const [key] of entries) {
              if (forbiddenKeywords.some((pattern) => pattern.test(key))) {
                console.error(`::error::Security violation: "${key}" contains sensitive keywords but has a VITE_ prefix. Frontend variables are public!`);
                process.exit(1);
              }
            }

            const content = entries.map(([key, value]) => `${key}=${value}`).join("\n") + "\n";
            require("fs").writeFileSync(".env.local", content);

            console.log(`Injected ${entries.length} safe frontend variables into .env.local:`);
            entries.forEach(([key]) => console.log(`  - ${key}`));
          '

      - name: Build application
        run: pnpm build:ssg

      - name: Build documentation
        run: pnpm docs:build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy application to staging server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/test.pointauc.com/html/

      - name: Deploy documentation to staging server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            docs/.vitepress/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/test.pointauc.com/html/docs/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key .env.local

      - name: Deployment Summary
        run: |
          echo "### Staging Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL:** test.pointauc.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Docs URL:** test.pointauc.com/docs" >> $GITHUB_STEP_SUMMARY
